<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetLife Stadium - Ookla Q3 2025 3D Analysis</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root{--p:#00D4FF;--s:#00FF88;--bg:#0a0e14;--card:#131920;--txt:#E6EDF3;--dim:#8B949E;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;}
        #map{position:absolute;inset:0;}
        .pnl{position:absolute;background:rgba(10,14,20,0.95);border:1px solid rgba(0,212,255,0.3);border-radius:16px;padding:20px;backdrop-filter:blur(10px);z-index:1000;}
        .pnl-t{font-family:'Orbitron',monospace;font-size:1em;color:var(--p);margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid rgba(0,212,255,0.3);display:flex;align-items:center;gap:10px;}
        .ctrl{top:20px;left:20px;width:300px;}
        .sts{top:20px;right:20px;width:260px;}
        .leg{bottom:40px;left:20px;}
        .lbtn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 15px;margin:6px 0;background:var(--card);border:1px solid transparent;border-radius:8px;color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:0.85em;cursor:pointer;transition:all 0.2s;}
        .lbtn:hover{border-color:var(--p);background:rgba(0,212,255,0.1);}
        .lbtn.act{border-color:var(--s);background:rgba(0,255,136,0.15);color:var(--s);}
        .ind{width:10px;height:10px;border-radius:50%;background:var(--dim);}
        .lbtn.act .ind{background:var(--s);box-shadow:0 0 8px var(--s);}
        .sr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
        .sr:last-child{border-bottom:none;}
        .sl{color:var(--dim);font-size:0.85em;}
        .sv{font-family:'Orbitron',monospace;font-weight:700;color:var(--s);}
        .lgr{width:200px;height:12px;border-radius:4px;margin:10px 0 5px;}
        .lgl{display:flex;justify-content:space-between;font-size:0.75em;color:var(--dim);font-family:'JetBrains Mono',monospace;}
        .vb{position:absolute;bottom:40px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:1000;}
        .vbtn{padding:10px 18px;background:rgba(10,14,20,0.95);border:1px solid rgba(0,212,255,0.3);border-radius:8px;color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:0.8em;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(10px);}
        .vbtn:hover{border-color:var(--p);background:rgba(0,212,255,0.1);}
        .ttl{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(10,14,20,0.9);border:1px solid rgba(0,212,255,0.3);border-radius:12px;padding:12px 25px;text-align:center;z-index:1000;backdrop-filter:blur(10px);}
        .ttl h1{font-family:'Orbitron',monospace;font-size:1.2em;background:linear-gradient(90deg,var(--p),var(--s));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .ttl .sub{font-size:0.75em;color:var(--dim);letter-spacing:2px;margin-top:4px;}
        .tgl{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:0.85em;cursor:pointer;}
        .tgl input{width:16px;height:16px;}
        .mapboxgl-popup-content{background:var(--card)!important;border:1px solid rgba(0,212,255,0.3)!important;border-radius:12px!important;color:var(--txt)!important;padding:15px!important;}
        .mapboxgl-popup-tip{border-top-color:var(--card)!important;}
        .pt{font-family:'Orbitron',monospace;color:var(--p);margin-bottom:10px;font-size:0.95em;}
        .pr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.85em;}
        .pv{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--s);}
        #ld{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron',monospace;color:var(--p);z-index:2000;animation:pls 1.5s infinite;}
        @keyframes pls{0%,100%{opacity:1;}50%{opacity:0.5;}}
    </style>
</head>
<body>
    <div id="ld">DECOMPRESSING DATA...</div>
    <div id="map"></div>
    <div class="ttl"><h1>METLIFE STADIUM</h1><div class="sub">OOKLA Q3 2025 • 3D MOBILE PERFORMANCE</div></div>
    <div class="pnl ctrl">
        <div class="pnl-t"><span>📡</span>LAYER CONTROLS</div>
        <button class="lbtn act" id="b-rsrp" onclick="sL('rsrp')"><span>📶 RSRP Signal</span><span class="ind"></span></button>
        <button class="lbtn" id="b-dl" onclick="sL('dl')"><span>⬇️ Download</span><span class="ind"></span></button>
        <button class="lbtn" id="b-ul" onclick="sL('ul')"><span>⬆️ Upload</span><span class="ind"></span></button>
        <button class="lbtn" id="b-lat" onclick="sL('lat')"><span>⏱️ Latency</span><span class="ind"></span></button>
        <button class="lbtn" id="b-sinr" onclick="sL('sinr')"><span>📊 SINR</span><span class="ind"></span></button>
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,212,255,0.3);">
            <label class="tgl"><input type="checkbox" id="t-das" checked onchange="tDAS()"><span>DAS Antennas</span></label>
            <label class="tgl"><input type="checkbox" id="t-3d" checked onchange="t3D()"><span>3D View</span></label>
        </div>
    </div>
    <div class="pnl sts">
        <div class="pnl-t"><span>📊</span>Q3 2025 STATS</div>
        <div id="stats-content"></div>
    </div>
    <div class="pnl leg">
        <div id="lg-t" style="font-family:'Orbitron',monospace;font-size:0.8em;color:var(--p);">RSRP (dBm)</div>
        <div class="lgr" id="lg-g" style="background:linear-gradient(90deg,#FF0000,#FFFF00,#00FF00);"></div>
        <div class="lgl"><span id="lg-mn">-110</span><span id="lg-md">-85</span><span id="lg-mx">-60</span></div>
    </div>
    <div class="vb">
        <button class="vbtn" onclick="sV('top')">🔽 Top</button>
        <button class="vbtn" onclick="sV('3d')">🎯 3D</button>
        <button class="vbtn" onclick="sV('orb')">🔄 Orbit</button>
    </div>

    // Decompress and parse data
    function decompress(b64) {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const decompressed = pako.inflate(bytes, { to: 'string' });
        return JSON.parse(decompressed);
    }
    
    // Layer configurations
    const LAYERS = {
        rsrp: { idx: 4, title: 'RSRP (dBm)', min: -110, max: -60, colors: ['#FF0000','#FF6600','#FFFF00','#66FF00','#00FF00'], stops: [-110,-97,-85,-72,-60] },
        dl: { idx: 7, title: 'DOWNLOAD (Mbps)', min: 0, max: 300, colors: ['#FF0000','#FF6600','#FFFF00','#66FF00','#00FF00'], stops: [0,75,150,225,300] },
        ul: { idx: 8, title: 'UPLOAD (Mbps)', min: 0, max: 60, colors: ['#FF0000','#FF6600','#FFFF00','#66FF00','#00FF00'], stops: [0,15,30,45,60] },
        lat: { idx: 9, title: 'LATENCY (ms)', min: 10, max: 60, colors: ['#00FF00','#66FF00','#FFFF00','#FF6600','#FF0000'], stops: [10,22,35,47,60] },
        sinr: { idx: 6, title: 'SINR (dB)', min: -5, max: 30, colors: ['#FF0000','#FF6600','#FFFF00','#66FF00','#00FF00'], stops: [-5,3,12,21,30] }
    };
    
    let D, map, cur = 'rsrp', orbI = null;
    
    // Initialize
    (async function init() {
        console.log('Decompressing data...');
        D = decompress(COMPRESSED_DATA);
        console.log('Data loaded:', D.pts.length, 'points');
        
        // Update stats
        const s = D.stats;
        document.getElementById('stats-content').innerHTML = `
            <div class="sr"><span class="sl">Points</span><span class="sv">${s.n}</span></div>
            <div class="sr"><span class="sl">Interior</span><span class="sv">${s.int}</span></div>
            <div class="sr"><span class="sl">Avg RSRP</span><span class="sv">${s.rsrp} dBm</span></div>
            <div class="sr"><span class="sl">Avg Download</span><span class="sv">${s.dl} Mbps</span></div>
            <div class="sr"><span class="sl">Peak Download</span><span class="sv">${s.dl_max} Mbps</span></div>
            <div class="sr"><span class="sl">Avg Upload</span><span class="sv">${s.ul} Mbps</span></div>
            <div class="sr"><span class="sl">Avg Latency</span><span class="sv">${s.lat} ms</span></div>
            <div class="sr"><span class="sl">Total Tests</span><span class="sv">${s.tst.toLocaleString()}</span></div>`;
        
        // Create GeoJSON from compact data
        const geojson = {
            type: 'FeatureCollection',
            features: D.pts.map(p => ({
                type: 'Feature',
                geometry: { type: 'Point', coordinates: [p[0], p[1]] },
                properties: { elv: p[2], in: p[3], rsrp: p[4], rsrq: p[5], sinr: p[6], dl: p[7], ul: p[8], lat: p[9], jit: p[10], tst: p[11], sec: p[12] }
            }))
        };
        
        const dasGeo = {
            type: 'FeatureCollection',
            features: D.das.map(d => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [d[0], d[1]] }, properties: { id: d[2] } }))
        };
        
        const stadGeo = { type: 'FeatureCollection', features: [{ type: 'Feature', geometry: { type: 'Polygon', coordinates: [[...D.stadium, D.stadium[0]]] } }] };
        const fieldGeo = { type: 'FeatureCollection', features: [{ type: 'Feature', geometry: { type: 'Polygon', coordinates: [[...D.field, D.field[0]]] } }] };
        
        mapboxgl.accessToken = "pk.eyJ1IjoiYXpoYXJ6NHUiLCJhIjoiY2pkaHFtbHAxMGV1cDJxbzI0cjFlcWt4eiJ9.D-0A_N0JhPBfOm-CeFZtMQ";
        map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/satellite-streets-v12',
            center: D.center,
            zoom: 16, pitch: 60, bearing: -20, antialias: true
        });
        
        map.on('load', () => {
            document.getElementById('ld').style.display = 'none';
            
            map.addSource('dem', { type: 'raster-dem', url: 'mapbox://mapbox.mapbox-terrain-dem-v1', tileSize: 512, maxzoom: 14 });
            map.setTerrain({ source: 'dem', exaggeration: 1.5 });
            map.addLayer({ id: 'sky', type: 'sky', paint: { 'sky-type': 'atmosphere', 'sky-atmosphere-sun': [0, 90], 'sky-atmosphere-sun-intensity': 15 } });
            
            map.addSource('stad', { type: 'geojson', data: stadGeo });
            map.addLayer({ id: 'stad-ln', type: 'line', source: 'stad', paint: { 'line-color': '#00D4FF', 'line-width': 3, 'line-opacity': 0.8 } });
            
            map.addSource('fld', { type: 'geojson', data: fieldGeo });
            map.addLayer({ id: 'fld-fl', type: 'fill', source: 'fld', paint: { 'fill-color': '#00FF88', 'fill-opacity': 0.3 } });
            
            map.addSource('das', { type: 'geojson', data: dasGeo });
            map.addLayer({ id: 'das-pt', type: 'circle', source: 'das', paint: { 'circle-radius': 8, 'circle-color': '#FFD700', 'circle-stroke-width': 2, 'circle-stroke-color': '#FFF' } });
            map.addLayer({ id: 'das-lb', type: 'symbol', source: 'das', layout: { 'text-field': ['get', 'id'], 'text-size': 10, 'text-offset': [0, 1.5] }, paint: { 'text-color': '#FFD700', 'text-halo-color': '#000', 'text-halo-width': 1 } });
            
            map.addSource('data', { type: 'geojson', data: geojson });
            map.addLayer({
                id: 'data-pt',
                type: 'circle',
                source: 'data',
                paint: {
                    'circle-radius': ['interpolate', ['linear'], ['zoom'], 14, 4, 18, 14],
                    'circle-color': ['interpolate', ['linear'], ['get', 'rsrp'], -110, '#FF0000', -97, '#FF6600', -85, '#FFFF00', -72, '#66FF00', -60, '#00FF00'],
                    'circle-opacity': 0.85,
                    'circle-stroke-width': 1,
                    'circle-stroke-color': '#FFF'
                }
            });
            
            map.on('click', 'data-pt', e => {
                const p = e.features[0].properties;
                new mapboxgl.Popup().setLngLat(e.lngLat).setHTML(`
                    <div class="pt">📍 ${p.sec}</div>
                    <div class="pr"><span>📶 RSRP</span><span class="pv">${p.rsrp} dBm</span></div>
                    <div class="pr"><span>📊 SINR</span><span class="pv">${p.sinr} dB</span></div>
                    <div class="pr"><span>⬇️ Download</span><span class="pv">${p.dl} Mbps</span></div>
                    <div class="pr"><span>⬆️ Upload</span><span class="pv">${p.ul} Mbps</span></div>
                    <div class="pr"><span>⏱️ Latency</span><span class="pv">${p.lat} ms</span></div>
                    <div class="pr"><span>📈 Tests</span><span class="pv">${p.tst.toLocaleString()}</span></div>
                `).addTo(map);
            });
            map.on('mouseenter', 'data-pt', () => map.getCanvas().style.cursor = 'pointer');
            map.on('mouseleave', 'data-pt', () => map.getCanvas().style.cursor = '');
        });
    })();
    
    function sL(l) {
        cur = l;
        const L = LAYERS[l];
        const stops = [];
        for (let i = 0; i < L.stops.length; i++) stops.push(L.stops[i], L.colors[i]);
        const prop = l === 'dl' ? 'dl' : l === 'ul' ? 'ul' : l === 'lat' ? 'lat' : l === 'sinr' ? 'sinr' : 'rsrp';
        map.setPaintProperty('data-pt', 'circle-color', ['interpolate', ['linear'], ['get', prop], ...stops]);
        document.getElementById('lg-t').textContent = L.title;
        document.getElementById('lg-g').style.background = `linear-gradient(90deg, ${L.colors.join(',')})`;
        document.getElementById('lg-mn').textContent = L.min;
        document.getElementById('lg-md').textContent = Math.round((L.min + L.max) / 2);
        document.getElementById('lg-mx').textContent = L.max;
        document.querySelectorAll('.lbtn').forEach(b => b.classList.remove('act'));
        document.getElementById('b-' + l).classList.add('act');
    }
    
    function tDAS() {
        const v = document.getElementById('t-das').checked ? 'visible' : 'none';
        map.setLayoutProperty('das-pt', 'visibility', v);
        map.setLayoutProperty('das-lb', 'visibility', v);
    }
    
    function t3D() { map.easeTo({ pitch: document.getElementById('t-3d').checked ? 60 : 0, duration: 1000 }); }
    
    function sV(v) {
        if (orbI) { clearInterval(orbI); orbI = null; }
        if (v === 'top') map.easeTo({ center: D.center, zoom: 16, pitch: 0, bearing: 0, duration: 1500 });
        else if (v === '3d') map.easeTo({ center: D.center, zoom: 16, pitch: 60, bearing: -20, duration: 1500 });
        else if (v === 'orb') {
            let b = map.getBearing();
            orbI = setInterval(() => { b += 0.5; map.easeTo({ bearing: b, duration: 50, easing: t => t }); }, 50);
        }
    }
    </script>
